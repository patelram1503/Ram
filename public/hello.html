    <h2>AJAX Form</h2>

    <!-- AJAX FORM -->
<form method="post" id="myForm">

        <input type="text"
               name="myTextInput"
               value="default"
               id="myText">

        <input type="password"
               name="myPass">

        <input type="week"
               name="myWeek">

        <input type="date"
               name="myDate">

        <input type="submit"
               value="Send">

        <input type="color"
               name="myColor">

    </form> 



<p id = "responseText"></p>


    <script>
        
        function myFunction() {
            console.log("debugging");
            alert("Form Submitted");
        }
// FOR SSE
const evtSource = new EventSource("/ticktock")

evtSource.addEventListener("message", (e) =>{
    console.log(e)
})
// FOR  SSE ENDS HERE

        document.getElementById("myForm").onsubmit = myFunction;
         document.getElementById("myForm").addEventListener("submit", (event) =>{
            event.preventDefault()

 const formData = new FormData(event.target)
 const urlEncoded = new URLSearchParams(formData)

           let myAjaxRequest = new XMLHttpRequest()
           myAjaxRequest.addEventListener("load", () =>{
             let res = JSON.parse(myAjaxRequest.responseText)
             document.getElementById("responseText").innerHTML = res.text
           })
           myAjaxRequest.open("POST", "/public/home")
           myAjaxRequest.setRequestHeader("Content-type", "application/x-www-form-urlencoded")
           myAjaxRequest.send(urlEncoded)
         })
    </script>
    </body>
</html>
